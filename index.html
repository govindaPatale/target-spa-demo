<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Target Recs Demo</title>
    <script src="https://assets.adobedtm.com/9076f6ae4b28/0a9fbbf65540/launch-15a3d1898942-development.min.js" async>
    </script>
</head>
<body>

    <h1>My Demo Store</h1>

    <div id="recs-container">
        <p>Fetching your personalized recommendations...</p>
    </div>

    <script>
        // Use a listener to make sure the page is ready
        document.addEventListener("DOMContentLoaded", function() {
            
            // Trigger the custom 'spa-recs' location
            adobe.target.getOffer({
                "mbox": "spa-recs",
                "params": {
                    "entity.id": "product-123", // Replace with a real ID from your catalog
                    "entity.categoryId": "featured"
                },
                "success": function(offer) {
                    // This injects the Recommendation into your div
                    adobe.target.applyOffer({
                        "mbox": "spa-recs",
                        "selector": "#recs-container",
                        "offer": offer
                    });
                },
                "error": function(status, error) {
                    console.error('Target Error:', status, error);
                }
            });
            
        });
    </script>

</body>
</html>
