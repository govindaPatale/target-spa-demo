<!DOCTYPE html>
<html>
<head>
  <title>Target SPA Demo</title>
  <meta charset="UTF-8" />

  <!-- Adobe Launch DEV (loads at.js 2.x) -->
  <script
    src="https://assets.adobedtm.com/9076f6ae4b28/0a9fbbf65540/launch-15a3d1898942-development.min.js"
    async>
  </script>
</head>

<body>
  <h1>Adobe Target SPA Recommendations Demo</h1>

  <nav>
    <button onclick="goTo('home')">Home</button>
    <button onclick="goTo('product1')">Product 1</button>
    <button onclick="goTo('product2')">Product 2</button>
  </nav>

  <hr />

  <div id="view"></div>

  <script>
    /*******************************
     * Utility: Track SPA View
     *******************************/
    function trackView(viewName) {
      if (window.adobe && adobe.target) {
        adobe.target.triggerView(viewName);
        console.log("Target view triggered:", viewName);
      }
    }

    /*******************************
     * Utility: Request Recommendations
     *******************************/
    function requestTarget(pageType, productId) {
      if (!window.adobe || !adobe.target) {
        console.warn("Adobe Target not loaded yet");
        return;
      }

      adobe.target.getOffers({
        request: {
          execute: {
            mboxes: [
              {
                index: 0,
                name: "spa-recs",
                parameters: {
                  pageType: pageType,   // home | product
                  productId: productId  // "", P1, P2
                }
              }
            ]
          }
        }
      }).then(function (response) {
        console.log("Target offers received:", response);

        adobe.target.applyOffers({
          response: response,
          selector: "#recs"
        });
      }).catch(function (error) {
        console.error("Target error:", error);
      });
    }

    /*******************************
     * SPA Navigation
     *******************************/
    function goTo(viewName) {
      const viewDiv = document.getElementById("view");

      if (viewName === "home") {
        viewDiv.innerHTML = `
          <h2>Home</h2>
          <div id="recs"></div>
        `;

        trackView("home");
        requestTarget("home", "");
      }

      if (viewName === "product1") {
        viewDiv.innerHTML = `
          <h2>Product 1</h2>
          <p>Product ID: P1</p>
          <div id="recs"></div>
        `;

        trackView("product-P1");
        requestTarget("product", "P1");
      }

      if (viewName === "product2") {
        viewDiv.innerHTML = `
          <h2>Product 2</h2>
          <p>Product ID: P2</p>
          <div id="recs"></div>
        `;

        trackView("product-P2");
        requestTarget("product", "P2");
      }
    }

    /*******************************
     * Initial Load
     *******************************/
    goTo("home");
  </script>
</body>
</html>
