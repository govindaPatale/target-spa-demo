<!DOCTYPE html>
<html>
<head>
  <title>Target SPA Demo</title>
  <meta charset="UTF-8" />
  <!-- Adobe Launch embed -->
  <script src="https://assets.adobedtm.com/9076f6ae4b28/0a9fbbf65540/launch-15a3d1898942-development.min.js" async></script>
</head>

<body>
  <h1>Adobe Target SPA Recommendations Demo</h1>

  <nav>
    <button onclick="goTo('home')">Home</button>
    <button onclick="goTo('product1')">Product 1</button>
    <button onclick="goTo('product2')">Product 2</button>
  </nav>

  <hr/>

  <div id="view"></div>

  <script>
    // 1️⃣ SPA navigation function
    function goTo(viewName) {
      if (viewName === 'home') {
        document.getElementById('view').innerHTML = `
          <h2>Home</h2>
          <div id="recs"></div>
        `;

        // Trigger Home recommendations
        triggerRecommendation('home-recs'); // Replace with your Target mbox
      }

      if (viewName === 'product1') {
        document.getElementById('view').innerHTML = `
          <h2>Product 1</h2>
          <p>Product ID: P1</p>
          <div id="recs"></div>
        `;

        // Trigger Product 1 recommendations
        triggerRecommendation('product-recs', { productId: 'P1' });
      }

      if (viewName === 'product2') {
        document.getElementById('view').innerHTML = `
          <h2>Product 2</h2>
          <p>Product ID: P2</p>
          <div id="recs"></div>
        `;

        // Trigger Product 2 recommendations
        triggerRecommendation('product-recs', { productId: 'P2' });
      }
    }

    // 2️⃣ Adobe Target helper function
    function triggerRecommendation(mboxName, params = {}) {
      if (typeof adobe === "undefined" || !adobe.target) {
        console.warn("Adobe Target not loaded yet.");
        return;
      }

      adobe.target.trigger({
        mbox: mboxName,
        params: params
      });
    }

    // 3️⃣ Default view
    goTo('home');
  </script>
</body>
</html>
